CH("소담에게 한 말","소담이 묻는다. “마을 사람들에게 탑의 예측을 어떻게 전할까요?”",[OP("“확정입니다. 모두 대피하세요.” (기억대로)",true,10,-5),OP("“가능성이 높습니다. 대비하되 지켜봅시다.”",false,-10,10)],"‘확정’이라는 말과 ‘가능성이 높다’는 말은 사람들의 행동을 다르게 만든다.")];
if(n==4)return[MM("북문 앞. 기억 속 하란이 외친다. ‘탑이 내가 쓰러진다고 했으니, 아무도 문 근처에 오지 마라!’"),SY("하란","“예측을 듣고 나니 싸울 마음이 사라지더군. 쓰러진다는 말이 나를 쓰러뜨리는 것 같았지.”"),
{mini:{msg:"되먹임의 소용돌이! 안개를 피해 올바른 판단(✦)을 모아라.",goal:12,sec:24,max:3,lv:3}},QZ("자기실현적 예언","예측을 믿고 행동한 결과, 그 예측이 실제로 맞게 되는 현상을 무엇이라 할까?",["자기실현적 예언","우연의 일치","데이터 삭제"],0,"예측이 행동을 바꾸고, 바뀐 행동이 예측을 현실로 만들 수 있어요. AI 추천을 믿고 따를 때도 일어날 수 있어요."),
CH("하란에게 한 말","하란이 묻는다. “탑의 예측을 모두에게 알릴까, 숨길까?”",[OP("기억대로 모두에게 알린다.",true,10,0),OP("숨기고, 각자 스스로 판단하게 둔다.",false,-10,5)],"알리는 것도 숨기는 것도 결과를 바꾼다. 정답보다 ‘책임’이 중요해지는 순간이다.")];
return[MM("탑의 맨 위. 모든 기억이 한 장면으로 모인다."),MM("나는 탑의 불을 끄고 있다. 모두가 나를 본다. 그리고 기억은… 거기서 끊겨 있다."),
SY("탑","“나는 네가 남긴 선택의 기록이다. 네가 본 ‘미래의 기억’은 내가 계산한 가장 그럴듯한 다음 장면이었다.”"),
SY("탑",all?"“너는 이 마을에 처음 온 것이 아니다. 지난 기록 속의 너도 매번 따랐다. 이번에도 그랬다.”":"“너는 이 마을에 처음 온 것이 아니다. 지난 기록 속의 너는 매번 따랐다. 하지만 이번엔 내 기록에 없던 선택이 생겼다.”"),
MM("처음 본 기억: ‘하란이 문 앞에서 쓰러진다.’ → 실제로 일어난 일: ‘"+(res?"하란은 쓰러지지 않았다.":"하란은 쓰러졌다.")+"’"),
SY("탑","“미래를 아는 것이 아니었다. 나는 네 과거를 읽고 ‘이번에도 따를 것이다’라고 짐작했을 뿐이다. 네가 그 짐작을 믿고 따를 때마다, 내 짐작은 맞는 것이 되었다.”"),
{mini:{msg:"탑이 무너진다! 마지막 폭풍을 뚫고 기억(✦)을 모아라.",goal:14,sec:26,max:3,lv:4}},QZ("책임","AI의 틀린 예측으로 피해가 생겼다면, 책임은 누구에게 있을까?",["AI는 기계라서 아무도 책임이 없다","AI 혼자 책임진다","만든 사람, 운영한 사람, 사용해 결정한 사람이 각자 역할만큼 따져 봐야 한다"],2,"AI는 도구예요. 판단과 결정은 사람이 하므로 역할에 맞게 책임을 나눠 져야 해요."),
CH("마지막 선택","탑이 묻는다. “마지막 장면은 비어 있다. 이 장면은 네가 쓴다. 불을 끌까?”",[OP("기억대로 탑의 불을 끈다.",true,10,0),OP("불을 끄지 않고, 탑과 대화를 시작한다.",false,-10,10)],"“알고도 선택했다는 사실이 의미를 만든다.”")]}
function stg(n){S.hp=Math.min(3,S.hp+1);snap();const nm=["","순응","균열","확률","되먹임","선택"][n];S.stage=n;S.busy=true;S.flash=.8;S.title={s:n+"막 · "+nm,u:Date.now()+2400};note("— "+n+"막 ‘"+nm+"’ —");
const L=SC(n),k=L.findIndex(x=>x.mem===undefined);S.rest=L.slice(k);S.target=["","","mujin","damsol","haran","gate"][n];hud();
run(L.slice(0,k),()=>{S.busy=false;S.mem=false;hint();hud()})}
function end(){const f=S.log.filter(l=>l.follow).length,r=Math.round(f/S.log.length*100),ti=r==100?"순응하는 자":r==0?"미래를 거스르는 자":"흔들리는 자",en=r==100?"평화롭지만 아무도 고르지 않은 세계가 되었다.":r==0?"혼란스럽지만 모두의 선택으로 쓰인 세계가 열렸다.":"일부는 지키고 일부는 거스른, 가장 인간적인 결말이 되었다.",gr=S.decode>=4?"기억 해독가":S.decode>=2?"견습 해독가":"다시 도전해 보세요",bad=S.study.filter(z=>!z.ok),wn=bad.length?"<b>오답 노트</b><ul>"+bad.map(z=>"<li><b>"+z.k+"</b> — "+z.why+"</li>").join("")+"</ul>":"<b>모든 기억을 해독했어요!</b><br>";
show("선택 기록","<b>"+en+"</b><br><b>칭호: ‘"+ti+"’ · 해독 등급: ‘"+gr+"’ ("+S.decode+"/4)</b><br><b>기억을 따른 비율: "+r+"%</b><ol>"+S.log.map(l=>"<li>"+l.q+": "+l.t+" <i>("+(l.follow?"따름":"거스름")+")</i></li>").join("")+"</ol>"+wn+"<b>토론 질문</b><ol><li>AI의 예측이나 추천을 얼마나 따르나요? 이유는 무엇인가요?</li><li>예측이 틀렸다면 그 책임은 누구에게 있을까요?</li><li>결과를 알 수 있어도 내가 직접 고르는 것에 의미가 있을까요?</li></ol><b>용어 도감</b><ul>"+S.gloss.map(g=>"<li><b>"+g.frag+"</b> — "+g.def+"</li>").join("")+"</ul><small>수고했어요! 선택을 바꿔 다시 하면 다른 결말과 칭호를 볼 수 있어요.</small>",[["처음부터 다시",()=>location.reload()]])}
function move(dx,dy){if(S.mini){S.mini.x+=dx*40;return}if(S.busy)return;S.dir=[dx,dy];if(Date.now()<(S.nx||0))return;const x=S.px+dx,y=S.py+dy;
if(x<0||y<0||x>14||y>9||"#HTWgL".includes(MAP[y][x])||STORY.npcs.some(n=>n.x==x&&n.y==y))return;S.px=x;S.py=y;S.nx=Date.now()+120;tone(90,.04,"square",.015);const k=SPK.find(q=>q[0]==x&&q[1]==y&&!S.found[q[2]]);if(k){S.found[k[2]]=1;S.frag++;S.gloss.push({frag:k[2],def:k[3]});hud();jingle();S.flash=.7;note("✦ 숨은 기억 조각 발견: "+k[2])}}
const near=(x,y)=>Math.abs(S.px-x)+Math.abs(S.py-y)==1;
function interact(){if(S.busy)return;const d=S.dir||[0,-1],tx=S.px+d[0],ty=S.py+d[1],n=STORY.npcs.find(n=>n.x==tx&&n.y==ty);if(n)return talk(n);if(tx==7&&ty==2)return gate();
show("","말을 걸 상대 쪽을 바라보고(방향키) 다시 ‘대화’를 눌러 보자.",[]);setTimeout(()=>{if(!S.busy)hint()},1200)}
const D={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]};
document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();move(...D[b.dataset.d])}));
$("talk").onclick=interact;$("dex").onclick=dex;$("box").onclick=()=>{if(SK)SK()};$("snd").onclick=()=>{MUTE=!MUTE;$("snd").textContent=MUTE?"🔇":"🔊"};
addEventListener("keyup",()=>{if(S.mini)S.mini.vx=0});
cv.addEventListener("pointermove",e=>{if(S.mini){const b=cv.getBoundingClientRect();S.mini.x=(e.clientX-b.left)/b.width*480}});
const pc=()=>Math.round(Math.min(90,30+S.trust*.7));
function snap(){const{fate,trust,frag,log,gloss,found,decode,study,talked,gateDone}=S;S.sv=JSON.stringify({fate,trust,frag,log,gloss,found,decode,study,talked,gateDone})}
function hurt(why){S.hp--;hud();tone(110,.4,"sawtooth",.06);note("♥ -1 · "+why);if(S.hp<=0){gameOver(why);return true}return false}
function gameOver(why){S.busy=true;S.mini=null;S.mem=false;show("기억이 흐려졌다…","<b>실패: "+why+"</b><br>♥를 모두 잃어 더 나아갈 수 없다.<br><small>이 막의 처음부터 다시 도전할 수 있어요. 퀴즈의 정답을 꼭 기억해 두세요!</small>",[["이 막부터 다시 도전",retry]],"q")}
function retry(){Object.assign(S,JSON.parse(S.sv));S.hp=3;S.px=7;S.py=8;P.rx=7;P.ry=8;S.mini=null;if(S.stage>1)stg(S.stage);else{S.busy=false;S.mem=false;hint();hud()}}
function startMini(c,done){show("기억의 폭풍","<b>"+c.msg+"</b><br>← → 키(또는 화면 드래그·버튼)로 움직여요. ✦ "+c.goal+"개를 모으면 성공! 검은 안개에 "+c.max+"번 맞으면 실패(♥ -1)!",[["시작",()=>{show("","✦를 모아라! 안개를 피해라!",[]);S.mini={x:240,vx:0,it:[],got:0,hit:0,goal:c.goal,max:c.max,lv:c.lv,end:Date.now()+c.sec*1000,done}}]])}
function drawMini(g,t){const m=S.mini,left=Math.max(0,(m.end-t)/1000);m.x=Math.max(16,Math.min(464,m.x+m.vx*6));
if(Math.random()<.06+m.lv*.015)m.it.push({x:20+Math.random()*440,y:-10,good:Math.random()<.55,v:1.8+Math.random()*1.4+m.lv*.25});
m.it.forEach(i=>i.y+=i.v);
m.it=m.it.filter(i=>{if(Math.abs(i.x-m.x)<22&&i.y>268&&i.y<312){if(i.good){m.got++;tone(760,.08,"triangle",.05)}else{m.hit++;m.fl=1;tone(110,.25,"sawtooth",.06)}return false}return i.y<330});
g.fillStyle="#0d0b1e";g.fillRect(0,0,480,320);
for(let k=0;k<30;k++){g.fillStyle="rgba(255,255,255,"+(.2+.5*H(k,5))+")";g.fillRect(H(k,1)*480|0,(H(k,2)*320+t/40*(.3+H(k,3)))%320|0,2,2)}
m.it.forEach(i=>{if(i.good){g.fillStyle="#9fd8ff";g.fillRect(i.x-2,i.y-8,4,16);g.fillRect(i.x-8,i.y-2,16,4);g.fillStyle="#fff";g.fillRect(i.x-2,i.y-2,4,4)}else{g.fillStyle="#3a1f4d";g.fillRect(i.x-10,i.y-8,20,16);g.fillStyle="#5a2f78";g.fillRect(i.x-8,i.y-10,16,4);g.fillStyle="#ff5a5a";g.fillRect(i.x-5,i.y-3,3,3);g.fillRect(i.x+2,i.y-3,3,3)}});
g.fillStyle="rgba(0,0,0,.3)";g.fillRect(m.x-14,312,28,4);spr(g,m.x-16,282,PAL.me);acc(g,"me",m.x-16,282);
if(m.fl>0){g.fillStyle="rgba(255,60,60,"+m.fl*.4+")";g.fillRect(0,0,480,320);m.fl-=.06}
g.font="18px 'Do Hyeon',sans-serif";g.textAlign="left";g.fillStyle="#ffe08a";g.fillText("✦ "+m.got+"/"+m.goal,12,26);g.textAlign="center";g.fillStyle="#fff";g.fillText("⏱ "+left.toFixed(1),240,26);g.textAlign="right";g.fillStyle="#ff8a8a";g.fillText("안개 "+m.hit+"/"+m.max,468,26);
if(m.got>=m.goal||m.hit>=m.max||left<=0){const ok=m.got>=m.goal,d=m.done;S.mini=null;d(ok)}}
const LG=[];function logm(s){LG.push(s);$("log").innerHTML=LG.slice(-4).map(x=>"<div>"+x+"</div>").join("")}
function note(s,ms){S.toast={s:s,u:Date.now()+(ms||2400)};logm(s)}
let BT=0;const MEL=[294,370,440,370,494,440,370,330];
function bgm(){if(BT)return;let i=0;BT=setInterval(()=>{tone(MEL[i%8],.9,"triangle",.02);if(i%4==0)tone(147,1.8,"sine",.035);i++},650)}
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,bgm,{once:true}));
document.addEventListener("keydown",e=>{if(S.mini){const v={ArrowLeft:-1,a:-1,ArrowRight:1,d:1}[e.key];if(v){e.preventDefault();S.mini.vx=v}return}const k=e.key,m={ArrowLeft:"L",a:"L",ArrowRight:"R",d:"R",ArrowUp:"U",w:"U",ArrowDown:"D",s:"D"}[k];
const bs=[...document.querySelectorAll("#btns button")];
if(S.busy){if(SK){if(k==" "||k=="Enter"){e.preventDefault();SK()}return}if(/^[1-9]$/.test(k)&&bs[k-1])bs[k-1].click();else if((k==" "||k=="Enter")&&bs.length==1){e.preventDefault();bs[0].click()}return}
if(m){e.preventDefault();move(...D[m])}else if(k==" "||k=="Enter"){e.preventDefault();interact()}});
draw();hud();$("go").onclick=()=>{$("start").style.display="none";snap();run(STORY.mem,()=>{S.busy=false;S.mem=false;hint();hud()},"mem","…");logm("바람이 분다. 마을에 해 질 무렵이 다가온다.")};
</script></body></html>
